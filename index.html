<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Chatbot na Nuvem</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { background: white; width: 400px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .historico { height: 300px; overflow-y: auto; background: #eef2f3; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        .mensagem { margin-bottom: 10px; padding: 8px; border-radius: 5px; }
        .user { background: #007bff; color: white; text-align: right; }
        .bot { background: #ddd; color: black; text-align: left; }
        input { width: 75%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 20%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>🤖 Assistente IA</h2>
        <div class="historico" id="historico"></div>

        <div style="margin-top:10px;">
            <input type="text" id="nickname" placeholder="Digite seu nickname (obrigatório)" />
        </div>

        <div style="margin-top:10px;">
            <input type="text" id="pergunta" placeholder="Digite sua pergunta...">
            <button onclick="enviarMensagem()">Enviar</button>
        </div>

        <div style="margin-top:10px; display:flex; gap:8px;">
            <button style="background:#6f42c1; width:100%;" onclick="verRanking()">🏆 Ver Ranking</button>
        </div>

        <div id="rankingWrap" style="display:none; margin-top:12px;">
            <h3>🏆 Ranking Global</h3>
            <div id="ranking" style="background:#eef2f3; padding:10px; border-radius:6px;"></div>
        </div>
    </div>

    <script>
        const URL_BACKEND = "https://api-agente-ia-ylph.onrender.com/api/chat";

        async function enviarMensagem() {
            const input = document.getElementById("pergunta");
            const historico = document.getElementById("historico");
            const texto = input.value;

            if (!texto) return;

            const nickname = document.getElementById("nickname").value;
            if (!nickname || !String(nickname).trim()) {
                historico.innerHTML += `<div class="mensagem bot">Informe um nickname para jogar ⚠️</div>`;
                return;
            }

            // Mostra a mensagem do usuário
            historico.innerHTML += `<div class="mensagem user">${texto}</div>`;
            input.value = "";
            historico.innerHTML += `<div class="mensagem bot" id="loading">Pensando...</div>`;

            try {
                const resposta = await fetch(URL_BACKEND, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nickname: nickname.trim(), pergunta: texto })
                });

                const dados = await resposta.json();

                // Remove loading e mostra resposta
                document.getElementById("loading").remove();
                historico.innerHTML += `<div class="mensagem bot">${dados.resposta || dados.erro || ""}</div>`;

                // Rola o chat para baixo
                historico.scrollTop = historico.scrollHeight;
            } catch (erro) {
                const loading = document.getElementById("loading");
                if (loading) loading.innerHTML = "Erro de conexão com o Servidor ❌";
            }
        }

        async function verRanking() {
            const rankingWrap = document.getElementById("rankingWrap");
            const rankingDiv = document.getElementById("ranking");

            rankingWrap.style.display = "block";
            rankingDiv.innerHTML = "Carregando...";

            try {
                const resposta = await fetch("https://api-agente-ia-ylph.onrender.com/api/ranking");
                const dados = await resposta.json();

                const ranking = dados.ranking || [];
                if (!ranking.length) {
                    rankingDiv.innerHTML = "Sem jogadores ainda.";
                    return;
                }

                rankingDiv.innerHTML = ranking.map((j, idx) => {
                    const medalha = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '';
                    return `
                        <div style="padding:6px 0; border-bottom:1px solid #ddd; display:flex; justify-content:space-between;">
                            <div>${medalha} <b>#${idx + 1}</b> ${j.nome} <span style="color:#666">(${j.titulo})</span></div>
                            <div><b>${j.xp}</b> XP</div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                rankingDiv.innerHTML = "Erro ao carregar ranking ❌";
            }
        }
    </script>
</body>
</html>
